<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartConvo — Admin Login</title>
  <link rel="icon" type="image/svg+xml" href="smc-icon.svg?v=3">
  <link rel="apple-touch-icon" href="smc-icon.svg?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAFAF7;
    --surface: #FFFFFF;
    --ink: #1A2332;
    --ink-soft: #5B6472;
    --line: #E4E1D8;
    --navy: #1E3A5F;
    --navy-deep: #14283F;
    --gold: #B08D2B;
    --gold-soft: #EFE6C8;
    --radius: 3px;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    min-height:100svh;
    display:flex;
    flex-direction:column;
  }

  a{color:inherit;text-decoration:none;}

  /* ---------- NAV ---------- */
  .nav{
    position:fixed;
    top:0;left:0;right:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:24px 48px;
    z-index:50;
  }
  .nav-mark{
    font-family:'Fraunces', serif;
    font-size:19px;
    font-weight:600;
    letter-spacing:0.01em;
  }
  .nav-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  /* ---------- LOGIN SECTION ---------- */
  .login-section{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:120px 24px 80px;
  }

  .frame{
    position:relative;
    padding:56px 64px;
    background:var(--surface);
    max-width:440px;
    width:100%;
  }
  .frame::before,
  .frame::after,
  .frame .corner-tl,
  .frame .corner-br{
    content:"";
    position:absolute;
    width:26px;
    height:26px;
    border:1.5px solid var(--navy);
    opacity:0.55;
  }
  .frame::before{ /* top-left */
    top:0;left:0;
    border-right:none;
    border-bottom:none;
  }
  .frame::after{ /* bottom-right */
    bottom:0;right:0;
    border-left:none;
    border-top:none;
  }
  .frame .corner-tl{
    top:0;right:0;
    border-left:none;
    border-bottom:none;
  }
  .frame .corner-br{
    bottom:0;left:0;
    border-right:none;
    border-top:none;
  }

  .scan-line{
    position:absolute;
    left:8px;right:8px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold) 80%, transparent);
    top:0;
    opacity:0.85;
    animation:scan 3.2s ease-in-out infinite;
  }
  @keyframes scan{
    0%{ top:6%; opacity:0; }
    10%{ opacity:0.85; }
    50%{ top:94%; opacity:0.85; }
    60%{ opacity:0; }
    100%{ top:6%; opacity:0; }
  }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--navy);
    margin-bottom:14px;
  }

  .login-title{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:36px;
    color:var(--navy-deep);
    margin-bottom:10px;
  }

  .login-sub{
    color:var(--ink-soft);
    font-size:14px;
    line-height:1.6;
    margin-bottom:34px;
  }

  /* ---------- FORM ---------- */
  .form-field{
    margin-bottom:22px;
  }
  .form-field label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:9px;
  }
  .form-field input{
    width:100%;
    padding:14px 16px;
    font-family:'Inter', sans-serif;
    font-size:15px;
    color:var(--ink);
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:var(--radius);
    transition:border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .form-field input::placeholder{
    color:#A9A9A0;
  }
  .form-field input:focus{
    outline:none;
    border-color:var(--gold);
    box-shadow:0 0 0 3px var(--gold-soft);
  }

  .note-hint{
    margin-top:6px;
    font-size:12px;
    color:var(--ink-soft);
  }

  .login-btn{
    width:100%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-top:10px;
    padding:15px 20px;
    background:var(--navy);
    color:#fff;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    border:none;
    border-radius:var(--radius);
    cursor:pointer;
    transition:background 0.25s ease, gap 0.2s ease;
  }
  .login-btn:hover{
    background:var(--navy-deep);
    gap:16px;
  }

  .back-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:26px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    transition:color 0.2s ease, gap 0.2s ease;
  }
  .back-link:hover{
    color:var(--gold);
    gap:13px;
  }
    .role-links{
    margin-top:32px;
    display:flex;
    justify-content:center;
    gap:28px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.05em;
  }
  .role-links a{
    color:var(--ink-soft);
    border-bottom:1px solid transparent;
    padding-bottom:2px;
    transition:color 0.2s ease, border-color 0.2s ease;
  }
  .role-links a:hover{
    color:var(--navy);
    border-color:var(--navy);
  }

  /* ---------- FOOTER ---------- */
  footer{
    border-top:1px solid var(--line);
    padding:28px 48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:0.04em;
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 860px){
    .nav{ padding:20px 24px; }
    .frame{ padding:40px 24px; }
    footer{ flex-direction:column; gap:8px; text-align:center; padding:24px; }
  }
  

  :focus-visible{
    outline:2px solid var(--gold);
    outline-offset:3px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
  .role-links{ gap:18px; flex-wrap:wrap; }
</style>
</head>
<body>

  <nav class="nav">
<a href="index.html" class="nav-mark">SmartConvo</a>
    <div class="nav-tag">Admin Access</div>
  </nav>

  <!-- ================= LOGIN ================= -->
  <section class="login-section">
    <div class="frame">
      <div class="scan-line"></div>
      <span class="corner-tl"></span>
      <span class="corner-br"></span>

      <div class="eyebrow">Admin Sign In</div>
      <h1 class="login-title">Welcome Back</h1>
      <p class="login-sub">Log in to manage student records, monitor the live queue, and oversee face verification logs.</p>

<form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-field">
  <label for="nama">Username</label>
  <input
    type="text"
    id="nama"
    name="nama"
    placeholder="Enter your username"
  >
</div>

        <div class="form-field">
  <label for="emel">University Email</label>
  <input
    type="email"
    id="emel"
    name="emel"
    placeholder="@lumut.tvetmara.edu.my"
  >
</div>

        <div class="form-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="login-btn">
          Sign In
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7h10M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>

      <a href="index.html" class="back-link">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M12 7H2M6 3l-4 4 4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back to Home
      </a>
    </div>
  </section>

        <div class="role-links">
        <a href="login-admin.html">Log in as Admin</a>
        <a href="login-guest.html">Log in as Guest</a>
        <a href="login-student.html">Log in as Student</a>
      </div>
    </div>
  </main>

  <footer>
    <span>© 2026 SmartConvo</span>
    <span>AI-Assisted Convocation Queue &amp; Identity Verification System</span>
  </footer>

<script>
const API_BASE_URL =
  "https://smartconvo-api.danishshazwan85.workers.dev";

async function handleLogin(event) {
  event.preventDefault();

  const username =
    document.getElementById("nama").value.trim();

  const email =
    document.getElementById("emel").value.trim();

  const password =
    document.getElementById("password").value;

  if (!username && !email) {
    alert("Please enter your username or university email.");
    return;
  }

  if (!password) {
    alert("Please enter your password.");
    return;
  }

  const identifier = email || username;

  try {
    const response = await fetch(
      `${API_BASE_URL}/api/admin/login`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          identifier: identifier,
          password: password
        })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      alert(data.message || "Admin login failed.");
      return;
    }

    localStorage.setItem(
      "adminToken",
      data.token
    );

    localStorage.setItem(
      "adminUser",
      JSON.stringify(data.admin)
    );

    window.location.href =
      "admin-dashboard.html";

  } catch (error) {
    console.error("Admin login error:", error);

    alert(
      "Unable to connect to SMARTCONVO server."
    );
  }
}
</script>

</body>
</html>
